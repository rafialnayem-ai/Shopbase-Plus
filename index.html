<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shopbase Plus</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* Mobile View Container */
        .app-container { width: 100%; max-width: 480px; height: 100%; background: #fff; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* Header & Search */
        .header { background: #ff6b6b; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: 10px; }
        .search-container { display: flex; flex: 1; background: white; border-radius: 4px; overflow: hidden; border: 1px solid #fff; }
        .search-container input { flex: 1; border: none; padding: 8px 10px; font-size: 14px; outline: none; }
        .search-container button { background: #333; color: white; border: none; padding: 0 15px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .menu-btn { background: none; border: none; color: white; font-size: 24px; font-weight: bold; cursor: pointer; padding: 0 5px; }
        
        /* Side Menu */
        .side-menu { position: absolute; top: 0; right: -250px; width: 250px; height: 100%; background: #fff; box-shadow: -2px 0 10px rgba(0,0,0,0.1); transition: right 0.3s ease; z-index: 1000; display: flex; flex-direction: column; }
        .side-menu.open { right: 0; }
        .menu-header { background: #333; color: white; padding: 15px; font-size: 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .menu-items { list-style: none; padding: 0; margin: 0; }
        .menu-items li { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 15px; color: #444; font-weight: bold; }
        .menu-items li:hover { background: #f9f9f9; color: #ff6b6b; }
        .menu-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .menu-overlay.open { display: block; }
        
        /* Product List */
        .product-list { flex: 1; overflow-y: auto; padding: 15px; background: #f9f9f9; }
        .product-card { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .product-info { flex: 1; padding-right: 10px; }
        .product-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 4px; line-height: 1.4; }
        .product-price { font-size: 13px; color: #ff6b6b; font-weight: bold; }
        .view-btn { background: #ff6b6b; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
        
        /* Modal for Details */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 10; flex-direction: column; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { background: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; }
        .modal-content { flex: 1; overflow-y: auto; padding: 20px; font-size: 14px; line-height: 1.6; color: #444; }
        .suggested-price { font-size: 13px; color: #d9534f; font-weight: bold; margin-top: 15px; }
        .sku-text { font-size: 13px; font-weight: bold; color: #555; margin-top: 5px; margin-bottom: 20px; }
        .download-btn { width: 100%; background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; justify-content: center; align-items: center; }
        .loader { text-align: center; padding: 20px; font-size: 14px; color: #666; }
        
        /* Pagination */
        .pagination { background: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #ddd; flex-shrink: 0; }
        .pagination button { background: #ff6b6b; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .pagination button:disabled { background: #ccc; cursor: not-allowed; }
        #pageIndicator { font-size: 14px; font-weight: bold; color: #444; }
        
        /* Lightbox Image Viewer */
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .lightbox img { max-width: 90%; max-height: 80%; object-fit: contain; }
        .lightbox-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; background: none; border: none; padding: 10px; font-weight: bold; z-index: 10000; }
        .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); color: white; font-size: 40px; cursor: pointer; background: rgba(0,0,0,0.5); border: none; padding: 15px; font-weight: bold; border-radius: 5px; }
        .lightbox-prev { left: 10px; }
        .lightbox-next { right: 10px; }
        .lightbox-counter { position: absolute; bottom: 20px; color: white; font-size: 16px; font-weight: bold; }

        @media (max-width: 767px) {
            .lightbox-nav { display: none; }
        }
        
        /* Desktop & Tablet Professional UI */
        @media (min-width: 768px) {
            body { align-items: flex-start; } 
            .app-container { max-width: 100%; width: 100%; height: 100vh; border-radius: 0; }
            
            .product-list { 
                display: grid; 
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
                gap: 20px; 
                padding: 25px; 
                align-content: start; 
            }
            .loader, #scrollLoader { grid-column: 1 / -1; }
            
            .product-card { 
                flex-direction: column; 
                align-items: flex-start; 
                margin-bottom: 0; 
                transition: transform 0.2s, box-shadow 0.2s; 
            }
            .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
            .product-card img { 
                width: 100% !important; 
                height: auto !important; 
                aspect-ratio: 2 / 3 !important; 
                margin-right: 0 !important; 
                margin-bottom: 15px; 
                border-radius: 8px; 
            }
            .product-info { width: 100%; margin-bottom: 15px; flex: 1; }
            .view-btn { width: 100%; padding: 10px; font-size: 14px; }
            
            /* Modal as a Popup on Desktop */
            .modal { background: rgba(0,0,0,0.8); padding: 40px; align-items: center; justify-content: center; }
            .modal-header { max-width: 800px; width: 100%; margin: 0 auto; border-radius: 12px 12px 0 0; }
            .modal-content { background: #fff; max-width: 800px; width: 100%; margin: 0 auto; border-radius: 0 0 12px 12px; flex: 0 1 auto; max-height: 85vh; overflow-y: auto; }
            #modalImageGallery img { width: 120px !important; height: 180px !important; aspect-ratio: 2 / 3; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search by Name or SKU...">
            <button onclick="searchProducts()">Search</button>
        </div>
        <button class="menu-btn" onclick="toggleMenu()">⋮</button>
    </div>

    <!-- Side Menu -->
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            Categories
            <button class="close-btn" onclick="toggleMenu()">✖</button>
        </div>
        <ul class="menu-items">
            <li onclick="changeCategory('2')">Women's Products</li>
            <li onclick="changeCategory('1')">Men's Products</li>
            <li onclick="changeCategory('all')">All Products</li>
        </ul>
    </div>

    <div class="product-list" id="productList">
        <div class="loader" id="loader">Loading products...</div>
    </div>
    
    <!-- Product Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-header">
            <span id="modalTitle" style="font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%;">Details</span>
            <button class="close-btn" onclick="closeModal()">Close ✖</button>
        </div>
        <div class="modal-content">
            <div id="modalImageGallery" style="display: flex; gap: 10px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px;"></div>
            <div id="modalInnerTitle" style="font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #333;"></div>
            <div id="modalDescription"></div>
            <div id="modalExtraLoader" style="color: #888; font-size: 12px; margin-top: 10px;">Fetching Details...</div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                <div id="modalPrice" style="font-weight: bold; color: #ff6b6b; font-size: 14px;"></div>
                <div id="modalStock" style="font-size: 13px; font-weight: bold;"></div>
            </div>
            <div id="modalRating" style="color: #f39c12; font-size: 16px; margin-top: 5px; letter-spacing: 2px;"></div>
            <div class="suggested-price" id="modalSuggestedPrice"></div>
            <div class="sku-text" id="modalSku"></div>
            <button class="download-btn" id="downloadBtn">Download</button>
        </div>
    </div>

    <!-- Image Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✖</button>
        <button class="lightbox-nav lightbox-prev" onclick="changeLightboxImage(-1)">❮</button>
        <img id="lightboxImg" src="" alt="View">
        <button class="lightbox-nav lightbox-next" onclick="changeLightboxImage(1)">❯</button>
        <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>
</div>

<script>
    const BACKEND_URL = 'https://shopbasebd-backend-production.up.railway.app'; // OLD: 'https://shopbasebd-backend.onrender.com' — Render blocked by shopbasebd.com // Removed the trailing slash

    let currentImages = [];
    let currentPage = 1;
    let currentCategory = '2';
    let isSearchMode = false;
    let isLoading = false;
    let hasMore = true;

    const publicVapidKey = 'BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeZpfiqQG3UvQY3T3rAqkH5Y740WMBv2g6_h-O-UGE54_6Q51l30';

    async function subscribeToPush() {
        if ('serviceWorker' in navigator) {
            try {
                const register = await navigator.serviceWorker.register('./sw.js');
                const subscription = await register.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
                });
                await fetch(`${BACKEND_URL}/subscribe`, {
                    method: 'POST',
                    body: JSON.stringify(subscription),
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch (e) {}
        }
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
        return outputArray;
    }

    // Browser Back Button Support for Modals
    window.addEventListener('popstate', (e) => {
        const hash = window.location.hash;
        if (hash !== '#lightbox') {
            document.getElementById('lightbox').style.display = 'none';
        }
        if (hash !== '#details' && hash !== '#lightbox') {
            document.getElementById('detailsModal').style.display = 'none';
        }
    });

    // Fetch products immediately on load
    window.onload = () => {
        loadProducts(currentPage, currentCategory, false);
        subscribeToPush();
        
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });

        // Infinite Scroll Listener
        const list = document.getElementById('productList');
        list.addEventListener('scroll', () => {
            if (isSearchMode) return;
            if (list.scrollTop + list.clientHeight >= list.scrollHeight - 50 && !isLoading && hasMore) {
                currentPage++;
                loadProducts(currentPage, currentCategory, true);
            }
        });
    };

    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('open');
        document.getElementById('menuOverlay').classList.toggle('open');
    }

    function changeCategory(category) {
        currentCategory = category;
        currentPage = 1;
        isSearchMode = false;
        hasMore = true;
        document.getElementById('searchInput').value = '';
        toggleMenu();
        loadProducts(currentPage, currentCategory, false);
    }

    async function searchProducts() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) {
            isSearchMode = false;
            hasMore = true;
            currentPage = 1;
            return loadProducts(1, currentCategory, false);
        }

        isSearchMode = true;
        const list = document.getElementById('productList');
        list.innerHTML = '<div class="loader">Searching...</div>';

        try {
            const res = await fetch(`${BACKEND_URL}/api/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (data.products && data.products.length > 0) {
                renderProducts(data.products, false);
            } else {
                list.innerHTML = '<div class="loader">No products found.</div>';
            }
        } catch (error) {
            list.innerHTML = '<div class="loader">Search failed.</div>';
        }
    }

    async function loadProducts(page, category, append = false) {
        if (isSearchMode) return;
        isLoading = true;
        const list = document.getElementById('productList');
        
        if (!append) {
            list.innerHTML = '<div class="loader">Loading products...</div>';
        } else {
            const loader = document.createElement('div');
            loader.className = 'loader';
            loader.id = 'scrollLoader';
            loader.innerText = 'Loading more products...';
            list.appendChild(loader);
        }

        try {
            const res = await fetch(`${BACKEND_URL}/api/products?page=${page}&category=${category}`);
            const data = await res.json();
            
            if (append) {
                const scrollLoader = document.getElementById('scrollLoader');
                if (scrollLoader) scrollLoader.remove();
            }

            if (data.products && data.products.length > 0) {
                renderProducts(data.products, append);
            } else {
                hasMore = false;
                if (!append) list.innerHTML = '<div class="loader">No products found.</div>';
            }
        } catch (error) {
            if (!append) list.innerHTML = '<div class="loader">Failed to load products.</div>';
        } finally {
            isLoading = false;
        }
    }

    function renderProducts(products, append = false) {
        const list = document.getElementById('productList');
        if (!append) {
            list.innerHTML = '';
        }
        
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            const coverImg = p.images && p.images.length > 0 ? p.images[0] : '';
            card.innerHTML = `
                <img src="${coverImg}" loading="lazy" style="width: 70px; height: 105px; object-fit: cover; border-radius: 4px; margin-right: 15px; flex-shrink: 0; display: ${coverImg ? 'block' : 'none'};">
                <div class="product-info">
                    <div class="product-title">${p.title}</div>
                    <div class="product-price">Price: ${p.price}</div>
                </div>
                <button class="view-btn" onclick='openModal(${JSON.stringify(p).replace(/'/g, "&apos;")})'>View</button>
            `;
            list.appendChild(card);
        });
    }

    let lightboxIndex = 0;

    async function openModal(product) {
        history.pushState({ modal: 'details' }, '', '#details');
        document.getElementById('detailsModal').style.display = 'flex';
        document.getElementById('modalTitle').innerText = product.title;
        
        const gallery = document.getElementById('modalImageGallery');
        const innerTitleElem = document.getElementById('modalInnerTitle');
        const descElem = document.getElementById('modalDescription');
        const regularPriceElem = document.getElementById('modalPrice');
        const stockElem = document.getElementById('modalStock');
        const ratingElem = document.getElementById('modalRating');
        const priceElem = document.getElementById('modalSuggestedPrice');
        const skuElem = document.getElementById('modalSku');
        const loader = document.getElementById('modalExtraLoader');
        
        gallery.innerHTML = '';
        innerTitleElem.innerText = product.title;
        descElem.innerHTML = product.description || '';
        regularPriceElem.innerText = `Price: ${product.price}`;
        stockElem.innerHTML = '';
        ratingElem.innerHTML = '';
        priceElem.innerText = '';
        skuElem.innerText = '';
        loader.style.display = 'block';
        
        currentImages = product.images || [];
        if (currentImages.length > 0) renderGallery(currentImages);

        try {
            let res;
            if (product.isSearch) {
                res = await fetch(`${BACKEND_URL}/api/product-details/${product.pid}`);
            } else {
                res = await fetch(`${BACKEND_URL}/api/details/${product.postId}`);
            }
            
            const data = await res.json();
            loader.style.display = 'none';
            priceElem.innerText = data.suggestedPrice || '';
            skuElem.innerText = data.sku || 'SKU: N/A';
            
            if (data.isStockAvailable !== undefined) {
                const stockLabel = JSON.parse(`"\\u09B8\\u09CD\\u099F\\u0995:"`);
                const statusText = data.isStockAvailable ? JSON.parse(`"\\u0986\\u099B\\u09C7"`) : JSON.parse(`"\\u09A8\\u09C7\\u0987"`);
                const stockColor = data.isStockAvailable ? "#28a745" : "#dc3545";
                stockElem.innerHTML = `<span style="color: #333;">${stockLabel} </span><span style="color: ${stockColor};">${statusText}</span>`;
            }
            
            if (data.rating !== undefined) {
                let stars = '';
                for (let i = 1; i <= 5; i++) {
                    stars += i <= data.rating ? '★' : '☆';
                }
                ratingElem.innerHTML = stars;
            }
            
            if (product.isSearch && data.description) {
                descElem.innerHTML = data.description;
            }
            if (product.isSearch && data.images) {
                currentImages = data.images;
                renderGallery(currentImages);
            }
        } catch (error) {
            loader.style.display = 'none';
        }

        const dBtn = document.getElementById('downloadBtn');
        dBtn.onclick = () => downloadAllImages(currentImages, dBtn);
    }

    function renderGallery(images) {
        const gallery = document.getElementById('modalImageGallery');
        gallery.innerHTML = '';
        images.forEach((imgSrc, index) => {
            gallery.innerHTML += `<img src="${imgSrc}" onclick="openLightbox(${index})" style="width: 100px; height: 150px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; flex-shrink: 0; cursor: pointer;">`;
        });
    }

    function closeModal() {
        if (window.location.hash === '#details') {
            history.back();
        } else {
            document.getElementById('detailsModal').style.display = 'none';
        }
    }

    function openLightbox(index) {
        history.pushState({ modal: 'lightbox' }, '', '#lightbox');
        lightboxIndex = index;
        document.getElementById('lightbox').style.display = 'flex';
        updateLightboxImage();
    }

    function closeLightbox() {
        if (window.location.hash === '#lightbox') {
            history.back();
        } else {
            document.getElementById('lightbox').style.display = 'none';
        }
    }

    function changeLightboxImage(step) {
        lightboxIndex += step;
        if (lightboxIndex < 0) lightboxIndex = currentImages.length - 1;
        if (lightboxIndex >= currentImages.length) lightboxIndex = 0;
        updateLightboxImage();
    }

    function updateLightboxImage() {
        if (!currentImages || currentImages.length === 0) return;
        document.getElementById('lightboxImg').src = currentImages[lightboxIndex];
        document.getElementById('lightboxCounter').innerText = `${lightboxIndex + 1} / ${currentImages.length}`;
    }

    // Lightbox Swipe Support for Mobile
    let touchstartX = 0;
    let touchendX = 0;
    const lightboxElem = document.getElementById('lightbox');

    lightboxElem.addEventListener('touchstart', e => {
        touchstartX = e.changedTouches[0].screenX;
    });

    lightboxElem.addEventListener('touchend', e => {
        touchendX = e.changedTouches[0].screenX;
        handleSwipe();
    });

    function handleSwipe() {
        if (touchendX < touchstartX - 50) {
            changeLightboxImage(1); // Swipe left -> Next Image
        }
        if (touchendX > touchstartX + 50) {
            changeLightboxImage(-1); // Swipe right -> Previous Image
        }
    }

    // Fix: Download via backend proxy to bypass CORS restrictions
    async function downloadAllImages(images, btnElement) {
        if (!images || images.length === 0) return alert('No images found.');
        
        btnElement.innerText = 'Downloading...';
        btnElement.disabled = true;
        btnElement.style.background = '#6c757d';

        for (let i = 0; i < images.length; i++) {
            try {
                const downloadUrl = `${BACKEND_URL}/api/download?url=${encodeURIComponent(images[i])}`;
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = images[i].substring(images[i].lastIndexOf('/') + 1);
                
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                await new Promise(resolve => setTimeout(resolve, 800)); // Delay prevents browser from blocking
            } catch (err) {
                console.error('Download error:', err);
            }
        }

        btnElement.innerText = 'Download';
        btnElement.disabled = false;
        btnElement.style.background = '#28a745';
    }
</script>
</body>
</html>
